name: Sparkgram APK bauen

on:
  push:
    branches: [main, entwicklung]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      SPARK_KEYSTORE_PASSWORD: ${{ secrets.SPARK_KEYSTORE_PASSWORD }}
    steps:
      - name: Secrets pruefen
        run: |
          missing=0
          for v in TELEGRAM_API_ID TELEGRAM_API_HASH SPARK_KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v fehlt (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          exit $missing

      - name: Speicherplatz freimachen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Signaturschluessel entschluesseln
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .github/signing/sparkgram.keystore.enc \
            -out TMessagesProj/config/release.keystore \
            -pass env:SPARK_KEYSTORE_PASSWORD

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PSPARK_ABIS=arm64-v8a \
            -PRELEASE_KEY_ALIAS=sparkgram \
            -PRELEASE_KEY_PASSWORD="$SPARK_KEYSTORE_PASSWORD" \
            -PRELEASE_STORE_PASSWORD="$SPARK_KEYSTORE_PASSWORD" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            --stacktrace

      - name: APK umbenennen
        id: apk
        run: |
          src=$(find TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' | head -1)
          name="Sparkgram-${GITHUB_REF_NAME}-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.apk"
          cp "$src" "$name"
          cp "$src" "Sparkgram-${GITHUB_REF_NAME}.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "stable=Sparkgram-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Als Release zum Herunterladen bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME}"
          gh release delete "$tag" --yes --cleanup-tag || true
          flag=""; [ "$GITHUB_REF_NAME" != "main" ] && flag="--prerelease"
          gh release create "$tag" "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.stable }}" $flag \
            --target "$GITHUB_SHA" \
            --title "Sparkgram (${GITHUB_REF_NAME}) – neuester Stand" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. APK auf dem Handy herunterladen und installieren."
